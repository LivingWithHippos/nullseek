[versions]
accompanist = "0.37.3"
activityCompose = "1.13.0"
agp = "9.4.0"
appcompat = "1.8.0"
composeBom = "2026.08.00"
composeTest = "1.11.4"
coreKtx = "1.19.0"
datastore = "1.2.1"
datetime = "0.8.0"
espressoCore = "3.7.0"
json = "1.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
koin-annotations = "2.3.1"  # Stable version
koin-bom = "4.2.2"
koin-plugin = "1.1.0"
