compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref="navigation" }

room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref="room" }
room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref="room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

square-logcat = { group = "com.squareup.logcat", name = "logcat", version.ref = "logcat" }

torbox-client = { group = "io.github.livingwithhippos", name = "torbox-kmp-client", version.ref = "torbox" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }
